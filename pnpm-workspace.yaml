packages:
  - packages/*

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  "crypto-js": "^4.2.0"
  "@types/crypto-js": "^4.2.2"
  "dompurify": "^3.3.3"
  "es-toolkit": "^1.45.1"

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'