packages:
  - packages/*

allowBuilds:
  esbuild: true

catalog:
  '@commitlint/cli': ^21.2.1
  '@commitlint/config-conventional': ^21.2.0
  '@delta-comic/plugin': '3.0.0-next.6'
  '@delta-comic/ui': '3.0.0-next.6'
  '@semantic-release/commit-analyzer': ^13.0.1
  '@semantic-release/github': ^12.0.9
  '@semantic-release/release-notes-generator': ^14.1.1
  '@tailwindcss/vite': ^4.3.0
  '@types/node': ^26.0.0
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  '@vitejs/plugin-vue': ^6.0.7
  '@vitest/coverage-v8': 5.0.0-beta.7
  browserslist: ^4.28.2
  happy-dom: ^20.10.6
  jszip: ^3.10.1
  lightningcss: ^1.32.0
  naive-ui: ^2.44.1
  oxlint-tsgolint: ^7.0.2001
  semantic-release: ^25.0.7
  tailwindcss: ^4.3.0
  typescript: ^7.1.0-dev.20260727.1
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: ^0.2.4
  vitest: 5.0.0-beta.7
  vue: ^3.5.40
  vue-tsgo: ^0.3.0

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

minimumReleaseAgeExclude:
  - typescript@7.0.2
  - semantic-release@25.0.7
  - '@delta-comic/plugin@3.0.0-next.6'
  - '@delta-comic/ui@3.0.0-next.6'
  - vue@3.5.40
  - '@delta-comic/db@3.0.0-next.6'
  - '@delta-comic/downloader@3.0.0-next.6'
  - '@delta-comic/logger@3.0.0-next.6'
  - '@delta-comic/model@3.0.0-next.6'
  - '@delta-comic/utils@3.0.0-next.6'