[package]
name = "jmcomic-helper"
version = "0.0.0-semantically-released"
edition = "2024"
rust-version = "1.92.0"

[package.metadata]
wasm-opt = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
image = "0.25.9"
js-sys = "0.3.85"
wasm-bindgen = "0.2.108"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
debug = false
incremental = true
