name: 插件校验

on:
  push:
    branches:
      - develop
      - main
      - next
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 检查、测试与构建
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JMCOMIC_TEST_PASSWORD: ${{ secrets.JMCOMIC_TEST_PASSWORD }}
      JMCOMIC_TEST_USERNAME: ${{ secrets.JMCOMIC_TEST_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Configure GitHub Packages authentication
        run: vp pm config set '//npm.pkg.github.com/:_authToken' "$GITHUB_TOKEN"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting
        run: vp fmt --check

      - name: Lint
        run: vp lint

      - name: Check TypeScript 7 and Vue types
        run: vp run typecheck

      - name: Run Vitest type tests
        run: vp test typecheck

      - name: Test runtime behavior with coverage
        run: vp test run --coverage

      - name: Build plugin
        run: vp run build

      - name: Validate plugin artifacts
        run: vp run artifacts

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jmcomic-${{ github.sha }}
          if-no-files-found: error
          path: |
            packages/app/dist/manifest.json
            packages/app/dist/plugin.zip