name: 插件校验

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 检查、测试与构建
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting, lint and types
        run: |
          vp check
          vp run typecheck

      - name: Test with coverage
        run: vp test run --coverage

      - name: Build plugin
        run: vp run build

      - name: Validate plugin artifacts
        run: vp run artifacts

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugin-template-${{ github.sha }}
          if-no-files-found: error
          path: |
            packages/app/dist/manifest.json
            packages/app/dist/plugin.zip